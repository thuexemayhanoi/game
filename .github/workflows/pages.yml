name: pages

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy only verified main builds: ci must have succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot ${{ env.GODOT_RELEASE }}
        run: |
          mkdir -p ~/.local/bin ~/.local/share/godot/export_templates
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 ~/.local/bin/godot
          chmod +x ~/.local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates ~/.local/share/godot/export_templates/${{ env.GODOT_RELEASE }}
      - name: Import project
        run: ~/.local/bin/godot --headless --path . --import --editor || true
      - name: Export Web build
        run: |
          mkdir -p build/web
          timeout 600 ~/.local/bin/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
