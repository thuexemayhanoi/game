name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all Python validators
        run: |
          python3 scripts/validate_matrix.py
          python3 scripts/validate_assets.py
          python3 scripts/validate_save_schema.py
          python3 scripts/check_build_budget.py
          python3 scripts/validate_project.py

  godot:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d ~/.local/share/godot/export_templates
          mv ~/.local/share/godot/export_templates/templates ~/.local/share/godot/export_templates/4.7.2.stable
          ./godot --version | head -n 2
      - name: Install GUT 9.7.1 (not vendored; see docs/TESTING.md)
        run: |
          git clone --depth 1 --branch v9.7.1 https://github.com/bitwes/Gut.git /tmp/gut
          mkdir -p addons
          cp -r /tmp/gut/addons/gut addons/gut
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Boot smoke (main scene, 300 frames)
        run: timeout 120 ./godot --headless --path . --quit-after 300
      - name: Run GUT tests
        run: ./godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -ginclude_subdirs -gexit
      - name: Export Web build
        run: |
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" "build/web/index.html"
          ls -la build/web
      - name: Record build budget baseline
        run: python3 scripts/check_build_budget.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  browser-smoke:
    runs-on: ubuntu-latest
    needs: godot
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-fund --no-audit -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests (5 viewports)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npx playwright test --config tests/browser/playwright.config.ts --reporter=list 2>&1 | tee playwright-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "Browser smoke test failure on commit $GITHUB_SHA."
              echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo ""
              echo ' ``` '
              tail -c 50000 playwright-output.log
              echo ' ``` '
            } > issue-body.md
            gh issue create --title "browser-smoke failure: run $GITHUB_RUN_ID" --body-file issue-body.md || true
          fi
          exit "$status"
